services:
  database:
    image: postgres:16-alpine
    container_name: portfoliohub-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfoliohub
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfoliohub"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: portfoliohub-backend
    restart: unless-stopped
    working_dir: /var/www
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: portfoliohub
      DB_USERNAME: portfolio
      DB_PASSWORD: portfolio_password
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
    depends_on:
      database:
        condition: service_healthy
    command: >
      sh -c "composer install --no-interaction &&
      if [ ! -f .env ]; then cp .env.example .env; fi &&
      php artisan key:generate --force &&
      php artisan serve --host=0.0.0.0 --port=8080"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: portfoliohub-frontend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "5175:5173"
    environment:
      VITE_API_URL: http://localhost:8080/api
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

  ai-service:
    profiles: ["ai"]
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: portfoliohub-ai
    restart: unless-stopped
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  backend_vendor:
  frontend_node_modules: