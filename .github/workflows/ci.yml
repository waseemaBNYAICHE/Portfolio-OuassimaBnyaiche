name: PortfolioHub CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend React
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le code
        run: npm run lint

      - name: Construire le frontend
        run: npm run build

      - name: Audit de sécurité npm
        run: npm audit --audit-level=critical

  backend:
    name: Backend Laravel
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Installer les dépendances Composer
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Préparer Laravel
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Exécuter les tests Laravel
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test

      - name: Audit de sécurité Composer
        run: composer audit

  docker:
    name: Validation Docker
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Valider Docker Compose
        run: docker compose config --quiet

      - name: Construire l’image Backend
        run: docker build -f docker/backend/Dockerfile -t portfoliohub-backend:ci .

      - name: Construire l’image Frontend
        run: docker build -f docker/frontend/Dockerfile -t portfoliohub-frontend:ci .

      - name: Construire l’image AI
        run: docker build -f ai-service/Dockerfile -t portfoliohub-ai:ci ai-service